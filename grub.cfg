# ============================================================================
#  Kil0yOS — GRUB 2 引导菜单配置
#  主题：深色背景 + 青色高亮，配合 assets/grub/background.png 壁纸（整屏黑底 + 左下角 Logo）
#  说明：背景图不依赖图形时（串口/无显示）会被安全忽略，均不影响引导。
# ============================================================================

set timeout=5
set default=0
set timeout_style=menu

# --- 加载图形与文件系统模块，让背景图能渲染 ---
insmod part_gpt
insmod part_msdos
insmod efi_gop
insmod efi_uga
insmod vbe
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod png
insmod jpeg
insmod font

# --- 加载完整 Unicode 字体（含制表符字形）---
# 否则 gfxterm 的菜单边框（─│┌┐ 等）会因缺字形而显示成 '?'。
# 加载成功才进入图形终端；失败则退回纯文本菜单，仍可正常引导。
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm

    # --- 主题：桌面壁纸 + 菜单配色（颜色格式为 前景/背景）---
    # 背景图为整屏尺寸（1920x1080 黑底 + 左下角 Logo），stretch 全屏铺不会变形，
    # Logo 因此稳定停在左下角，不依赖 GRUB 视口定位（部分版本非全屏视口不渲染）。
    background_image -m stretch /boot/grub/background.png
    set color_normal=light-gray/black
    set color_highlight=black/cyan
    set menu_color_normal=light-gray/black
    set menu_color_highlight=black/cyan
fi

# --- 菜单项 ---
menuentry "Kil0yOS" {
    multiboot2 /boot/kil0yos.bin
    boot
}

menuentry "Kil0yOS（详细启动日志）" {
    multiboot2 /boot/kil0yos.bin log=serial
    boot
}

menuentry "重启" {
    reboot
}

menuentry "关机" {
    halt
}
