name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc nasm grub-pc-bin grub-common xorriso mtools zstd qemu-system-x86

    - name: make
      run: make -j2

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: kil0yos-iso
        path: build/kil0yos.iso
